<!DOCTYPE html>
<html>
<head><title>Student Data Entry</title></head>
<body>
    <h2>Enter Student Details</h2>
    <form method="POST">
        Name: <input type="text" name="name" required><br><br>
        Roll Number: <input type="text" name="roll" required><br><br>
        Phone: <input type="text" name="phone" required><br><br>
        CGPA: <input type="text" name="cgpa" required><br><br>
        Degree: <input type="text" name="degree" required><br><br>
        <button type="submit">Submit Data</button>
    </form>
    <br>
    <a href="/results">View Results Portal</a>
</body>
</html>
